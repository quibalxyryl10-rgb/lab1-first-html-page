<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Restaurant Manager</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">🍽️ Restaurant Manager</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <span class="navbar-text text-white me-3" id="userDisplay">
                                Welcome, <span id="userName">User</span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar vh-100 p-3">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Menu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-danger" href="#" id="logoutLink">Logout</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <!-- Welcome Greeting -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                    <h2 id="greeting" class="text-primary-custom">Good Morning, User!</h2>
                </div>

                <!-- Statistic Cards -->
                <section class="row mb-4">
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-primary-custom text-center">
                            <div class="card-body">
                                <h5 class="card-title text-muted" id="stat1-title">Daily Orders</h5>
                                <h2 class="card-text fw-bold text-primary" id="stat1-value">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-success-custom text-center">
                            <div class="card-body">
                                <h5 class="card-title text-muted" id="stat2-title">Revenue</h5>
                                <h2 class="card-text fw-bold text-success" id="stat2-value">$0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-accent text-center">
                            <div class="card-body">
                                <h5 class="card-title text-accent" id="stat3-title">Menu Items</h5>
                                <h2 class="card-text fw-bold text-info" id="stat3-value">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card text-center">
                            <div class="card-body">
                                <h5 class="card-title text-muted" id="stat4-title">Tables</h5>
                                <h2 class="card-text fw-bold text-warning" id="stat4-value">0</h2>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Recent Activity Table -->
                <section>
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">📋 Recent Orders</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr class="border-accent">
                                            <th>Time</th>
                                            <th>Order</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="activityTableBody">
                                        <!-- Dynamic content -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 bg-light mt-4 border-top">
        <p class="mb-0">&copy; 2026 Restaurant Manager. All rights reserved.</p>
    </footer>

    <!-- Bootstrap 5 JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/dashboard.js"></script>
</body>
</html>
